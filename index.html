<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ой бәйгесі — Квиз интеллектуалды сайысы</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background-color: #351309;
      background-image:
        linear-gradient(rgba(30, 10, 4, .12), rgba(30, 10, 4, .3)),
        url("background.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      color: #fff4d8;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(900px, 92%);
      padding: 60px 18px;
      text-align: center;
      animation: appear 1.2s ease-out both;
    }

    .badge {
      display: inline-block;
      margin-bottom: 26px;
      padding: 10px 22px;
      border: 1px solid rgba(241, 194, 103, .45);
      border-radius: 40px;
      background: rgba(52, 20, 9, .6);
      color: #f4d59a;
      font-size: 14px;
      letter-spacing: 2px;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 10vw, 110px);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: 3px;
      color: #ffd88b;
      text-shadow:
        0 4px 24px rgba(0, 0, 0, .5),
        0 0 55px rgba(234, 158, 52, .25);
    }

    .subtitle {
      margin: 22px 0 0;
      font-size: clamp(18px, 3vw, 28px);
      line-height: 1.5;
      color: #ffedcc;
    }

    .line {
      width: 100px;
      height: 2px;
      margin: 30px auto;
      background: linear-gradient(
        to right, transparent, #e8b65d, transparent
      );
    }

    .info {
      margin: 0 0 38px;
      color: #e5c9a0;
      font-size: 16px;
      line-height: 1.7;
    }

    .start {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      min-height: 60px;
      padding: 18px 38px;
      border: 1px solid #ffe1a0;
      border-radius: 16px;
      background: linear-gradient(135deg, #ffe0a0, #d99335);
      box-shadow: 0 8px 35px rgba(214, 133, 36, .3);
      color: #3c1a08;
      font: inherit;
      font-size: 19px;
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
    }

    .start:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 42px rgba(234, 163, 66, .45);
    }

    .start:focus-visible {
      outline: 3px solid #fff4d8;
      outline-offset: 6px;
    }

    .motto {
      margin-top: 42px;
      color: #d8b78a;
      font-size: 14px;
      letter-spacing: 1px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .badge {
        font-size: 11px;
        letter-spacing: 1px;
      }

      h1 {
        letter-spacing: 0;
      }

      .start {
        width: 100%;
        max-width: 320px;
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      main {
        animation: none;
      }

      .start {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="badge">5–7-СЫНЫПТАР · 3 ТОП</div>

    <h1>ОЙ БӘЙГЕСІ</h1>

    <p class="subtitle">Квиз интеллектуалды сайысы</p>

    <div class="line" aria-hidden="true"></div>

    <p class="info">
      Біліміңді шыңда. Тапқырлығыңды таныт.<br>
      Командаңмен бірге жеңіске жет!
    </p>

    <a class="start" href="teams.html">
      Сайысты бастау <span aria-hidden="true">→</span>
    </a>

    <p class="motto">Білім • Бірлік • Жеңіс</p>
  </main>
</body>
</html>
