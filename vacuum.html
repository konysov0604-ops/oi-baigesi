<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D вакуум зертханасы</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#140e10;color:#fff0d8;
  font-family:"Segoe UI",Arial,sans-serif
}
.lab{
  position:relative;width:100%;
  height:620px;min-height:500px;overflow:hidden;
  background:radial-gradient(ellipse at center,#423022,#140e10 70%)
}
#scene{position:absolute;inset:0}
canvas{display:block;touch-action:none}
.top{
  position:absolute;top:18px;left:20px;right:20px;
  pointer-events:none
}
h1{font-size:21px;margin:0 0 7px;color:#ffdc98}
.subtitle{font-size:12px;color:#ccb89d;line-height:1.6}
.badge{
  display:inline-block;margin-top:12px;
  padding:7px 12px;border:1px solid #dfb56888;
  border-radius:30px;background:#201410bb;
  font-size:12px;color:#ffe0a2
}
.legend{
  position:absolute;top:122px;left:20px;
  display:grid;gap:9px;font-size:12px;pointer-events:none
}
.legend span{
  background:#1c1515dd;padding:8px 12px;border-radius:8px;
  border:1px solid #ffffff22
}
.gold{color:#ffd476}.cyan{color:#76e9fa}
.bottom{
  position:absolute;left:15px;right:15px;bottom:16px;
  text-align:center
}
#status{
  min-height:42px;font-size:13px;line-height:1.6;
  text-shadow:0 2px 8px #000
}
.controls{
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:8px;margin-top:10px
}
button{
  padding:11px 14px;border-radius:10px;
  border:1px solid #d3aa67;background:#322017;
  color:#ffe1a7;font:inherit;font-size:12px;
  font-weight:700;cursor:pointer
}
button.primary{
  background:linear-gradient(135deg,#ffe3a0,#d99a38);
  color:#341b0a
}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid white;outline-offset:3px}
.hint{
  margin-top:10px;color:#ac9983;
  font-size:11px;line-height:1.6
}
#loadError{
  position:absolute;inset:0;display:grid;place-items:center;
  padding:35px;background:#211516;text-align:center;
  line-height:1.8;z-index:5
}
[hidden]{display:none!important}
@media(max-width:500px){
  .lab{height:650px}
  h1{font-size:18px}
  .legend{top:130px}
  button{padding:10px;font-size:11px}
}
</style>
</head>

<body>
<div class="lab">
  <div id="scene" aria-label="Екі шардың вакуумда түсуін көрсететін айналмалы 3D модель"></div>

  <div class="top">
    <h1>3D ВАКУУМ ЗЕРТХАНАСЫ</h1>
    <div class="subtitle">
      Бірдей биіктік · Бір мезет · Бастапқы жылдамдық нөл
    </div>
    <span class="badge" id="mode">Камерада ауа бар</span>
  </div>

  <div class="legend">
    <span class="gold">● Алтын шар — 2 кг</span>
    <span class="cyan">● Көгілдір шар — 1 кг</span>
  </div>

  <div class="bottom">
    <div id="status" role="status" aria-live="polite">
      3D зертхана жүктелуде…
    </div>

    <div class="controls">
      <button class="primary" id="pump" disabled>
        ① Ауаны шығару
      </button>
      <button class="primary" id="drop" disabled>
        ② Шарларды жіберу
      </button>
      <button id="reset" disabled>↶ Қайта тәжірибе</button>
    </div>

    <div class="controls">
      <button id="left" disabled aria-label="Көріністі солға айналдыру">↶ Солға</button>
      <button id="right" disabled aria-label="Көріністі оңға айналдыру">Оңға ↷</button>
      <button id="zoomIn" disabled>＋ Жақындату</button>
      <button id="zoomOut" disabled>− Алыстату</button>
    </div>

    <div class="hint">
      Тінтуірмен сүйреп айналдырыңыз. Дөңгелекпен жақындатыңыз.<br>
      Оқу моделі: ауа жоқ кездегі еркін түсу. Өлшемдер шартты.
    </div>
  </div>

  <div id="loadError" hidden></div>
</div>

<script type="module">
const $ = id => document.getElementById(id);

try {
  // Алғашқы ашылғанда интернет қажет.
  const THREE = await import(
    "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  );

  const host = $("scene");
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x140e10,.022);

  const camera = new THREE.PerspectiveCamera(42,1,.1,100);

  const renderer = new THREE.WebGLRenderer({
    antialias:true,
    alpha:true
  });

  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.35;

  host.appendChild(renderer.domElement);

  // Жарық.
  scene.add(new THREE.HemisphereLight(0xffedcb,0x33202b,2));

  const key = new THREE.DirectionalLight(0xffd797,4);
  key.position.set(4,8,6);
  key.castShadow = true;
  key.shadow.mapSize.set(1024,1024);
  key.shadow.camera.left = -5;
  key.shadow.camera.right = 5;
  key.shadow.camera.top = 8;
  key.shadow.camera.bottom = -5;
  key.shadow.normalBias = .025;
  scene.add(key);

  const blueLight = new THREE.PointLight(0x65dcff,28,15);
  blueLight.position.set(-4,4,-2);
  scene.add(blueLight);

  const goldLight = new THREE.PointLight(0xffb347,25,15);
  goldLight.position.set(3,5,1);
  scene.add(goldLight);

  // Еден.
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(50,50),
    new THREE.MeshStandardMaterial({
      color:0x201619,roughness:.72,metalness:.15
    })
  );
  floor.rotation.x = -Math.PI/2;
  floor.position.y = -.08;
  floor.receiveShadow = true;
  scene.add(floor);

  const metal = new THREE.MeshStandardMaterial({
    color:0x9d784b,metalness:.8,roughness:.28
  });

  const darkMetal = new THREE.MeshStandardMaterial({
    color:0x302b2a,metalness:.65,roughness:.35
  });

  function cylinder(radius,height,y,material) {
    const mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(radius,radius,height,80),
      material
    );
    mesh.position.y = y;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    return mesh;
  }

  cylinder(2.2,.28,.14,darkMetal);
  cylinder(1.93,.12,.34,metal);
  cylinder(1.93,.18,5.45,metal);
  cylinder(2.12,.16,5.62,darkMetal);

  // Платформадағы жарық сақинасы.
  function ring(y,color) {
    const mesh = new THREE.Mesh(
      new THREE.TorusGeometry(1.96,.025,12,100),
      new THREE.MeshStandardMaterial({
        color,emissive:color,emissiveIntensity:2
      })
    );
    mesh.rotation.x = Math.PI/2;
    mesh.position.y = y;
    scene.add(mesh);
  }

  ring(.34,0xffc46b);
  ring(5.45,0x76d8e7);

  // Мөлдір камера.
  const glass = new THREE.Mesh(
    new THREE.CylinderGeometry(1.9,1.9,4.94,80,1,true),
    new THREE.MeshPhysicalMaterial({
      color:0x9acbd3,
      transparent:true,
      opacity:.1,
      metalness:.1,
      roughness:.12,
      side:THREE.DoubleSide,
      depthWrite:false
    })
  );

  glass.position.y = 2.9;
  glass.renderOrder = 2;
  scene.add(glass);

  // Камераның жіңішке тіректері.
  [0,Math.PI/2,Math.PI,Math.PI*1.5].forEach(angle => {
    const rod = new THREE.Mesh(
      new THREE.CylinderGeometry(.025,.025,5.05,10),
      metal
    );
    rod.position.set(
      Math.cos(angle)*1.91,2.9,Math.sin(angle)*1.91
    );
    scene.add(rod);
  });

  // Екі шар бірдей көлемде, массалары әртүрлі.
  const radius = .3;
  const startY = 4.7;
  const landingY = .4 + radius;

  const goldBall = new THREE.Mesh(
    new THREE.SphereGeometry(radius,48,32),
    new THREE.MeshStandardMaterial({
      color:0xffc04e,metalness:.7,roughness:.2,
      emissive:0x6b3600,emissiveIntensity:.25
    })
  );

  const blueBall = new THREE.Mesh(
    new THREE.SphereGeometry(radius,48,32),
    new THREE.MeshStandardMaterial({
      color:0x64dff8,metalness:.6,roughness:.18,
      emissive:0x083d59,emissiveIntensity:.3
    })
  );

  goldBall.position.set(-.75,startY,0);
  blueBall.position.set(.75,startY,0);

  [goldBall,blueBall].forEach(ball => {
    ball.castShadow = true;
    scene.add(ball);
  });

  // Бастапқы биіктікті көрсететін сызық.
  const startLine = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-1.45,startY,-.5),
      new THREE.Vector3(1.45,startY,-.5)
    ]),
    new THREE.LineBasicMaterial({
      color:0xffd79b,transparent:true,opacity:.4
    })
  );
  scene.add(startLine);

  // Ауа бөлшектерінің шартты көрінісі.
  const particleCount = 130;
  const positions = new Float32Array(particleCount*3);
  const bases = [];

  for (let i=0;i<particleCount;i++) {
    const angle = Math.random()*Math.PI*2;
    const r = Math.sqrt(Math.random())*1.65;

    bases.push({
      x:Math.cos(angle)*r,
      y:.65+Math.random()*4.4,
      z:Math.sin(angle)*r,
      phase:Math.random()*Math.PI*2
    });
  }

  const particlesGeometry = new THREE.BufferGeometry();
  particlesGeometry.setAttribute(
    "position",new THREE.BufferAttribute(positions,3)
  );

  const particlesMaterial = new THREE.PointsMaterial({
    color:0xb8e1e9,size:.045,
    transparent:true,opacity:.65,depthWrite:false
  });

  const particles = new THREE.Points(
    particlesGeometry,particlesMaterial
  );
  scene.add(particles);

  // Камераны тінтуірмен айналдыру.
  let azimuth = .18;
  let elevation = .14;
  let distance = 13.5;
  const target = new THREE.Vector3(0,2.65,0);

  function placeCamera() {
    camera.position.set(
      Math.sin(azimuth)*Math.cos(elevation)*distance,
      target.y+Math.sin(elevation)*distance,
      Math.cos(azimuth)*Math.cos(elevation)*distance
    );
    camera.lookAt(target);
  }

  let dragging = false;
  let pointerId = null;
  let previousX = 0;
  let previousY = 0;

  renderer.domElement.addEventListener("pointerdown",e => {
    if (dragging) return;
    dragging = true;
    pointerId = e.pointerId;
    previousX = e.clientX;
    previousY = e.clientY;
    renderer.domElement.setPointerCapture(e.pointerId);
  });

  renderer.domElement.addEventListener("pointermove",e => {
    if (!dragging || e.pointerId !== pointerId) return;

    azimuth -= (e.clientX-previousX)*.007;
    elevation += (e.clientY-previousY)*.005;
    elevation = Math.max(-.08,Math.min(.65,elevation));

    previousX = e.clientX;
    previousY = e.clientY;
    placeCamera();
  });

  function releasePointer() {
    dragging = false;
    pointerId = null;
  }

  renderer.domElement.addEventListener("pointerup",releasePointer);
  renderer.domElement.addEventListener("pointercancel",releasePointer);
  renderer.domElement.addEventListener("lostpointercapture",releasePointer);

  renderer.domElement.addEventListener("wheel",e => {
    e.preventDefault();
    distance = Math.max(9,Math.min(19,distance+e.deltaY*.01));
    placeCamera();
  },{passive:false});

  $("left").onclick = () => {
    azimuth -= .25;
    placeCamera();
  };

  $("right").onclick = () => {
    azimuth += .25;
    placeCamera();
  };

  $("zoomIn").onclick = () => {
    distance = Math.max(9,distance-1);
    placeCamera();
  };

  $("zoomOut").onclick = () => {
    distance = Math.min(19,distance+1);
    placeCamera();
  };

  // Тәжірибе күйі.
  let mode = "air";
  let pumping = 0;
  let fallingTime = 0;
  let elapsed = 0;
  let lastFrame = performance.now();

  function updateControls() {
    $("pump").disabled = mode !== "air";
    $("drop").disabled = mode !== "vacuum";
    $("reset").disabled = false;
  }

  $("pump").onclick = () => {
    if (mode !== "air") return;
    mode = "pumping";
    pumping = 0;

    $("mode").textContent = "Ауа шығарылуда…";
    $("status").textContent =
      "Камерадағы ауа бөлшектері азайып жатыр.";

    updateControls();
  };

  $("drop").onclick = () => {
    if (mode !== "vacuum") return;

    mode = "falling";
    fallingTime = 0;
    $("status").textContent =
      "Екі шар бір мезетте жіберілді. Олардың қозғалысын салыстырыңдар.";

    updateControls();
  };

  $("reset").onclick = () => {
    mode = "air";
    pumping = 0;
    fallingTime = 0;
    goldBall.position.y = startY;
    blueBall.position.y = startY;
    particlesMaterial.opacity = .65;

    $("mode").textContent = "Камерада ауа бар";
    $("status").textContent =
      "Алдымен ауаны шығарыңыз, содан кейін шарларды жіберіңіз.";

    updateControls();
  };

  function resize() {
    const width = host.clientWidth;
    const height = host.clientHeight;

    renderer.setSize(width,height);
    camera.aspect = width/height;
    camera.updateProjectionMatrix();
  }

  new ResizeObserver(resize).observe(host);

  renderer.domElement.addEventListener(
    "webglcontextlost",
    e => {
      e.preventDefault();
      $("loadError").hidden = false;
      $("loadError").textContent =
        "3D көрініс тоқтады. Бетті жаңартып көріңіз.";
    }
  );

  function frame(now) {
    const delta = Math.min((now-lastFrame)/1000,.05);
    lastFrame = now;
    elapsed += delta;

    if (mode === "pumping") {
      pumping = Math.min(1,pumping+delta/2.5);
      particlesMaterial.opacity = .65*(1-pumping);

      if (pumping >= 1) {
        mode = "vacuum";
        $("mode").textContent = "ВАКУУМ · Ауа кедергісі жоқ";
        $("status").textContent =
          "Камера дайын. «Шарларды жіберу» батырмасын басыңыз.";
        updateControls();
      }
    }

    for (let i=0;i<particleCount;i++) {
      const p = bases[i];
      positions[i*3] = p.x+Math.sin(elapsed+p.phase)*.06;
      positions[i*3+1] = p.y+Math.cos(elapsed*1.2+p.phase)*.06;
      positions[i*3+2] = p.z+Math.sin(elapsed*.8+p.phase)*.06;
    }

    particlesGeometry.attributes.position.needsUpdate = true;

    if (mode === "falling") {
      // Көрнекілік үшін уақыт екі есе баяулатылған.
      fallingTime += delta*.5;

      // y = y0 − g·t²/2. Екі шарға бірдей есеп.
      const y = Math.max(
        landingY,
        startY-.5*9.81*fallingTime*fallingTime
      );

      goldBall.position.y = y;
      blueBall.position.y = y;

      if (y <= landingY) {
        mode = "landed";
        $("mode").textContent = "ТӘЖІРИБЕ АЯҚТАЛДЫ";
        $("status").textContent =
          "Екі шар қатар түсті! Вакуумда олардың еркін түсу үдеуі бірдей. Көрініс 2 есе баяулатылған.";
        updateControls();
      }
    }

    renderer.render(scene,camera);
    requestAnimationFrame(frame);
  }

  ["left","right","zoomIn","zoomOut"].forEach(id => {
    $(id).disabled = false;
  });

  $("status").textContent =
    "Алдымен ауаны шығарыңыз, содан кейін шарларды жіберіңіз.";

  resize();
  placeCamera();
  updateControls();
  requestAnimationFrame(frame);

} catch(error) {
  $("loadError").hidden = false;
  $("loadError").textContent =
    "3D зертхана жүктелмеді. Интернетті тексеріп, бетті жаңартыңыз. Бұл көрініске WebGL қолдайтын браузер қажет.";
}
</script>
</body>
</html>
