<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ой импульсі — ауызша жарыс</title>
<style>
*{box-sizing:border-box}
:root{--gold:#ffd88b;--cream:#fff3dc}
body{
  margin:0;min-height:100vh;color:var(--cream);
  font-family:"Segoe UI",Arial,sans-serif;
  background:linear-gradient(#220a0699,#220a06dd),
  url("background.png.png") center/cover fixed;
  background-color:#301007
}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.38;cursor:default}
button:focus-visible,a:focus-visible{
  outline:3px solid white;outline-offset:4px
}
main{width:min(1180px,94%);margin:auto;padding:24px 0}
header{
  display:flex;justify-content:space-between;
  align-items:center;flex-wrap:wrap;gap:15px;
  padding-bottom:20px;border-bottom:1px solid #d7a04e66
}
a{color:var(--gold)}
.brand{text-decoration:none;font-weight:800;letter-spacing:2px}
h1{margin:0;font-size:clamp(21px,3vw,34px);color:var(--gold)}
.stage{
  display:grid;grid-template-columns:210px 1fr;
  gap:20px;margin-top:24px
}
.panel{
  border:1px solid #d7a04e66;border-radius:22px;
  background:linear-gradient(140deg,#512b20cc,#20100eee);
  padding:25px
}
.host{text-align:center;padding:25px 16px}
.orb{
  width:145px;height:145px;margin:5px auto 22px;
  display:grid;place-items:center;border-radius:50%;
  border:2px solid #e8ab4c;
  background:radial-gradient(circle,#b96e2255,#200b07);
  box-shadow:0 0 35px #ffb83444,inset 0 0 30px #ffaa2233;
  font-size:65px;color:var(--gold)
}
.speaking{animation:pulse .7s infinite alternate}
.host h2{font-size:15px;letter-spacing:2px;color:var(--gold)}
.host p{font-size:12px;line-height:1.7;color:#e7cba9}
.host button{width:100%;margin-top:9px}
.primary,.ghost,.correct,.wrong{
  padding:13px 18px;border-radius:12px;font-weight:700
}
.primary{
  background:linear-gradient(135deg,#ffe4a2,#e3a038);
  border:1px solid #ffe4a5;color:#391b09
}
.ghost{background:#2b120dbb;color:#f2d3a2;border:1px solid #b3864c88}
.correct{background:#254a31;color:#d7ffbf;border:1px solid #a2d28a}
.wrong{background:#552923;color:#ffdbd2;border:1px solid #c68477}
.question-layout{
  display:grid;grid-template-columns:1fr 140px;
  align-items:center;gap:24px
}
.subject{
  display:inline-block;padding:8px 15px;border-radius:30px;
  border:1px solid #e9b45d88;color:var(--gold);font-size:13px
}
.question{
  font-size:clamp(24px,3vw,36px);
  line-height:1.45;margin:22px 0;font-weight:700
}
.hint{font-size:14px;line-height:1.7;color:#dfc19b}
.timer{
  width:130px;height:130px;border:3px solid #edba67;
  border-radius:50%;display:grid;align-content:center;
  text-align:center;background:#30150e
}
.timer b{font-size:52px;color:var(--gold);font-variant-numeric:tabular-nums}
.timer span{font-size:11px;color:#dfbd8c}
.answer{
  margin-top:20px;padding:18px;border-radius:13px;
  border:1px solid #d8b36c;background:#82601c25;line-height:1.7
}
.answer strong{display:block;font-size:25px;color:#ffe1a1}
.answer p{margin:7px 0 0}
.controls,.judging{
  display:flex;flex-wrap:wrap;gap:10px;margin-top:18px
}
.banner{
  padding:16px 20px;margin-top:20px;border:1px solid #d7a04e66;
  border-radius:12px;background:#32160ddd;line-height:1.7
}
.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.team{
  --accent:#ffd26c;padding:18px;border-radius:18px;
  background:#25130eee;border:1px solid var(--accent);
  text-align:center
}
.team:nth-child(2){--accent:#6be5f6}
.team:nth-child(3){--accent:#d7a1ff}
.team.selected{box-shadow:0 0 28px var(--accent);transform:translateY(-4px)}
.team.winner{background:#314124ee}
.team img{width:90px;height:95px;object-fit:contain}
.team h2{font-size:19px;color:var(--accent);margin:10px 0}
.score{font-size:32px;font-weight:800;margin:8px 0 14px}
.score small{font-size:13px;font-weight:400}
.choose{
  width:100%;padding:12px 6px;border-radius:10px;
  background:#ffffff0b;color:var(--accent);
  border:1px solid var(--accent);font-weight:700
}
footer{
  margin-top:24px;display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;font-size:12px
}
[hidden]{display:none!important}
@keyframes pulse{to{box-shadow:0 0 60px #ffb83488;transform:scale(1.04)}}
@media(max-width:750px){
  .stage{grid-template-columns:1fr}
  .host{padding:15px}
  .orb{width:80px;height:80px;font-size:40px;margin:0 auto 12px}
  .host button{width:auto;font-size:12px}
  .question-layout{grid-template-columns:1fr}
  .timer{width:90px;height:90px}
  .timer b{font-size:34px}
  .teams{gap:7px}
  .team{padding:12px 5px}
  .team img{width:60px;height:65px}
  .team h2{font-size:12px}
  .score{font-size:25px}
  .choose{font-size:11px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main>
<header>
  <a class="brand" href="index.html">ОЙ БӘЙГЕСІ</a>
  <h1>1-ТУР · ОЙ ИМПУЛЬСІ</h1>
  <span id="counter"></span>
</header>

<div class="stage">
  <aside class="panel host">
    <div class="orb" id="orb" aria-hidden="true">◎</div>
    <h2>ЖИ-ХАБАРШЫ</h2>
    <p id="voiceStatus" role="status"></p>
    <button class="primary" id="read">▶ Сұрақты тыңдау</button>
    <button class="ghost" id="start">Таймерді бастау</button>
  </aside>

  <section class="panel">
    <div class="question-layout">
      <div>
        <span class="subject" id="subject"></span>
        <div class="question" id="question"></div>
        <div class="hint" id="hint">
          Бірінші белгі берген топты жүргізуші таңдайды.
        </div>
      </div>
      <div class="timer">
        <b id="seconds">20</b>
        <span id="timerLabel">ойлану уақыты</span>
      </div>
    </div>

    <div class="judging" id="judging" hidden>
      <button class="correct" id="correct">✓ Дұрыс +10</button>
      <button class="wrong" id="wrong">✕ Қате — басқа топ</button>
    </div>

    <div class="answer" id="answer" hidden>
      <strong id="answerText"></strong>
      <p id="explanation"></p>
    </div>

    <div class="controls">
      <button class="ghost" id="pause" disabled>Ⅱ Кідірту</button>
      <button class="ghost" id="reveal">Жауапты ашу</button>
      <button class="primary" id="next">Келесі сұрақ →</button>
      <button class="ghost" id="undo" hidden>↶ Осы жауапты қайтару</button>
    </div>
  </section>
</div>

<div class="banner" id="banner" role="status" aria-live="polite"></div>

<section class="teams" aria-label="Командалар">
  <article class="team" id="team0">
    <img src="impuls.png.png" alt="Импульс">
    <h2>ИМПУЛЬС</h2>
    <div class="score"><b id="score0">0</b> <small>ұпай</small></div>
    <button class="choose" data-team="0">Бірінші жауап береді</button>
  </article>
  <article class="team" id="team1">
    <img src="kvant.png.png" alt="Квант">
    <h2>КВАНТ</h2>
    <div class="score"><b id="score1">0</b> <small>ұпай</small></div>
    <button class="choose" data-team="1">Бірінші жауап береді</button>
  </article>
  <article class="team" id="team2">
    <img src="nova.png.png" alt="Нова">
    <h2>НОВА</h2>
    <div class="score"><b id="score2">0</b> <small>ұпай</small></div>
    <button class="choose" data-team="2">Бірінші жауап береді</button>
  </article>
</section>

<footer>
  <a href="teams.html">← Командалар</a>
  <span>Дұрыс жауап: +10 · Қате жауап: 0</span>
  <button class="ghost" id="music">♫ Әуен: қосулы</button>
  <button class="ghost" id="reset">Турды қайта бастау</button>
</footer>
</main>

<script>
const QUESTIONS = [
  {
    subject:"Математика",
    text:"Мен 1 минутта 120 сөз оқимын. Осы жылдамдықпен 30 секундта қанша сөз оқимын?",
    answer:"60 сөз",
    explanation:"30 секунд — бір минуттың жартысы. 120 : 2 = 60."
  },
  {
    subject:"Қазақ тілі",
    text:"«Білімді оқушы» тіркесіндегі «білімді» сөзі қай сөз табына жатады?",
    answer:"Сын есім",
    explanation:"Қандай оқушы? Білімді оқушы. Заттың белгісін білдіреді."
  },
  {
    subject:"Жаратылыстану · Биология",
    text:"Өсімдік жапырағы жарықта фотосинтез кезінде ауаға қандай газ бөледі?",
    answer:"Оттек",
    explanation:"Фотосинтез нәтижесінде оттек бөлінеді."
  },
  {
    subject:"Қазақстан тарихы",
    text:"Қазақ хандығының негізін қалаған екі ханды атаңдар.",
    answer:"Керей мен Жәнібек",
    explanation:"Қазақ хандығының негізін қалаушылар — Керей хан мен Жәнібек хан."
  },
  {
    subject:"География",
    text:"Жер шарындағы ауданы ең үлкен мұхит қалай аталады?",
    answer:"Тынық мұхиты",
    explanation:"Тынық мұхиты — ауданы бойынша ең үлкен мұхит."
  },
  {
    subject:"Информатика",
    text:"Мақсатқа жеткізетін реттелген әрекеттер тізбегі қалай аталады?",
    answer:"Алгоритм",
    explanation:"Алгоритм — мақсатқа жеткізетін нақты әрекеттер тізбегі."
  },
  {
    subject:"Ағылшын тілі",
    text:"Ағылшын тіліндегі «book» сөзін қазақшаға аударыңдар.",
    answer:"Кітап",
    explanation:"Book сөзі «кітап» дегенді білдіреді."
  },
  {
    subject:"Музыка · Ұлттық мәдениет",
    text:"Екі ішекті, шертіп ойналатын қазақтың ұлттық музыкалық аспабын атаңдар.",
    answer:"Домбыра",
    explanation:"Домбыра — қазақтың екі ішекті ұлттық аспабы."
  },
  {
    subject:"Дене шынықтыру",
    text:"Классикалық волейболда бір командадан алаңда бір мезетте неше ойыншы ойнайды?",
    answer:"6 ойыншы",
    explanation:"Әр командадан алаңда алты ойыншы болады."
  }
];

const NAMES = ["ИМПУЛЬС","КВАНТ","НОВА"];
const $ = id => document.getElementById(id);
const KEY = "oi-baigesi-round1-oral-v1";

function fresh() {
  return {
    index:0,
    done:false,
    records:QUESTIONS.map(() => ({
      winner:null, wrong:[], revealed:false, open:false
    }))
  };
}

let state = fresh();

try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  const valid = saved &&
    Number.isInteger(saved.index) &&
    saved.index >= 0 && saved.index < 9 &&
    typeof saved.done === "boolean" &&
    Array.isArray(saved.records) &&
    saved.records.length === 9 &&
    saved.records.every(r =>
      r && (r.winner === null || [0,1,2].includes(r.winner)) &&
      Array.isArray(r.wrong) &&
      r.wrong.every(t => [0,1,2].includes(t)) &&
      new Set(r.wrong).size === r.wrong.length &&
      typeof r.revealed === "boolean" &&
      typeof r.open === "boolean"
    );
  if (valid) state = saved;
} catch(error) {}

let selected = null;
let clock = null;
let timerKind = null;
let paused = false;
let left = 20;
let deadline = 0;
let thinkingLeft = 20;
let reading = false;
let audio = null;
let speech = null;
let voiceId = 0;
let watchdog = null;
let audioContext;
let musicEnabled = true;
let sounds = [];
let musicLoop = null;
let musicStep = 0;
let lastTick = -1;

const record = () => state.records[state.index];
const closed = () => record().revealed || record().winner !== null;

function save() {
  try { localStorage.setItem(KEY,JSON.stringify(state)); }
  catch(error) {
    $("banner").textContent =
      "Сақтау қолжетімсіз. Бетті жаппай, ұпайларды жазып алыңыз.";
  }
}

function total(team) {
  return state.records.filter(r => r.winner === team).length * 10;
}

function unlock() {
  if (!musicEnabled) return;
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    if (!audioContext) audioContext = new Audio();
    audioContext.resume().catch(() => {});
  } catch(error) {}
}

function note(frequency,duration=.4,delay=0,volume=.025) {
  if (!musicEnabled || !audioContext ||
      audioContext.state !== "running" || document.hidden) return;

  const now = audioContext.currentTime + delay;
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.frequency.value = frequency;
  gain.gain.setValueAtTime(0,now);
  gain.gain.linearRampToValueAtTime(volume,now+.02);
  gain.gain.exponentialRampToValueAtTime(.0001,now+duration);

  oscillator.connect(gain);
  gain.connect(audioContext.destination);
  oscillator.start(now);
  oscillator.stop(now+duration+.04);
  sounds.push(oscillator);

  oscillator.onended = () => {
    oscillator.disconnect();
    gain.disconnect();
    sounds = sounds.filter(s => s !== oscillator);
  };
}

function stopMusic() {
  clearInterval(musicLoop);
  musicLoop = null;
  sounds.forEach(s => { try{s.stop();}catch(error){} });
  sounds = [];
}

function startMusic() {
  stopMusic();
  if (!musicEnabled || timerKind !== "thinking") return;

  const melody = [440,523,659,587,440,392,523,659];
  function beat() {
    if (!clock || paused || reading || left <= 5 ||
        document.hidden) return;
    const f = melody[musicStep++ % melody.length];
    note(f,1.1,0,.015);
    note(f/2,1.2,0,.015);
  }

  beat();
  musicLoop = setInterval(beat,1500);
}

document.addEventListener("click",e => {
  if (e.target.closest("button")) unlock();
},true);

function stopVoice() {
  voiceId++;
  clearTimeout(watchdog);
  if (audio) {
    audio.onended = null;
    audio.onerror = null;
    audio.pause();
    audio = null;
  }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  speech = null;
  reading = false;
  $("orb").classList.remove("speaking");
}

function stopClock() {
  clearInterval(clock);
  clock = null;
  stopMusic();
}

function timerPaint() {
  $("seconds").textContent = Math.max(0,Math.ceil(left));
  $("timerLabel").textContent =
    timerKind === "answer" ? "жауап беру уақыты" : "ойлану уақыты";
}

function ui() {
  const r = record();
  const finished = state.done;

  $("counter").textContent = finished
    ? "Тур аяқталды" : `Сұрақ ${state.index+1} / 9`;

  $("judging").hidden = selected === null || finished;
  $("pause").disabled = !clock && !paused;
  $("pause").textContent = paused ? "▶ Жалғастыру" : "Ⅱ Кідірту";

  $("read").disabled = finished || reading ||
    selected !== null || closed() || clock !== null || paused;

  $("start").disabled = finished || selected !== null ||
    closed() || clock !== null || paused;

  $("reveal").disabled = finished || closed();
  $("next").disabled = finished;
  $("next").textContent = state.index === 8
    ? "Турды аяқтау →" : "Келесі сұрақ →";

  $("answer").hidden = !r.revealed || finished;
  $("undo").hidden = finished ||
    !(r.winner !== null || r.wrong.length > 0 || r.revealed);

  document.querySelectorAll(".choose").forEach(button => {
    const team = Number(button.dataset.team);
    const failed = r.wrong.includes(team);

    button.disabled = finished || reading || selected !== null ||
      closed() || failed || !r.open;

    button.textContent = r.winner === team
      ? "✓ +10 ұпай"
      : failed ? "Бұл сұраққа жауап берді"
      : "Жауап беретін топ";

    $("team"+team).classList.toggle("selected",selected === team);
    $("team"+team).classList.toggle("winner",r.winner === team);
    $("score"+team).textContent = total(team);
  });
}

function show() {
  stopClock();
  stopVoice();
  selected = null;
  paused = false;
  timerKind = null;
  thinkingLeft = 20;
  left = 20;
  lastTick = -1;

  const q = QUESTIONS[state.index];
  $("subject").textContent = state.done ? "ҚОРЫТЫНДЫ" : q.subject;
  $("question").textContent = state.done
    ? "Бірінші тур аяқталды!" : q.text;
  $("answerText").textContent = q.answer;
  $("explanation").textContent = q.explanation;

  $("hint").textContent = state.done
    ? "Үш команданың қорытынды ұпайы төменде көрсетілген."
    : "Бірінші белгі берген топты жүргізуші таңдайды.";

  $("voiceStatus").textContent = state.done
    ? "Білім • Бірлік • Жеңіс"
    : "Сұрақты тыңдаңыз немесе жүргізуші оқып, таймерді бастасын.";

  $("banner").textContent = state.done
    ? "Ұпайлар сақталды. Бұл турда 9 сұраққа барлығы 90 ұпай ойнатылды."
    : record().winner !== null
      ? `${NAMES[record().winner]} — дұрыс жауап! +10 ұпай.`
      : closed()
        ? "Жауап ашылды. Келесі сұраққа өтуге болады."
        : record().open
          ? "Сұрақ ашық. Топты таңдаңыз немесе таймерді қайта бастаңыз."
          : "Сұрақ оқылғаннан кейін белгі беріңіздер. «Келесі сұрақ» батырмасы уақытты күтпейді.";

  timerPaint();
  ui();
}

function expire() {
  const kind = timerKind;
  stopClock();
  paused = false;
  left = 0;
  timerPaint();

  if (kind === "answer") {
    $("banner").textContent =
      `${NAMES[selected]}: 5 секунд аяқталды. Жүргізуші айтылған жауапты бағалайды.`;
  } else {
    $("banner").textContent =
      "20 секунд аяқталды. Белгі берген топ болса таңдаңыз немесе жауапты ашыңыз.";
  }

  note(523,.22,0,.035);
  note(392,.4,.2,.03);
  ui();
}

function tick() {
  left = Math.max(0,(deadline-performance.now())/1000);
  if (timerKind === "thinking") thinkingLeft = left;
  timerPaint();

  const second = Math.ceil(left);
  if (second > 0 && second <= 5 && lastTick !== second) {
    if (timerKind === "thinking") stopMusic();
    note(700+(5-second)*60,.12,0,.025);
  }
  lastTick = second;

  if (left <= 0) expire();
}

function runTimer(seconds,kind) {
  stopClock();
  timerKind = kind;
  left = seconds;
  paused = false;
  lastTick = -1;
  deadline = performance.now()+seconds*1000;
  clock = setInterval(tick,100);
  timerPaint();
  startMusic();
  ui();
}

function beginThinking() {
  if (state.done || closed() || selected !== null) return;

  stopVoice();
  record().open = true;
  thinkingLeft = 20;
  save();
  runTimer(20,"thinking");

  $("voiceStatus").textContent = "Сұрақ оқылды. Жарыс басталды!";
  $("banner").textContent =
    "Бірінші белгі берген топты таңдаңыз — таймер тоқтайды.";
}

function voiceFailure(id) {
  if (id !== voiceId) return;
  stopVoice();
  $("voiceStatus").textContent =
    "Қазақша аудио ойнатылмады. Сұрақты оқып, «Таймерді бастау» басыңыз.";
  ui();
}

function deviceVoice(id) {
  if (id !== voiceId) return;

  // MP3 қатесі мен play қатесінің қатар келуінен қорғаныс.
  if (speech) return;

  if (audio) {
    audio.onended = null;
    audio.onerror = null;
    audio.pause();
    audio = null;
  }

  if (!("speechSynthesis" in window)) {
    voiceFailure(id);
    return;
  }

  const voice = speechSynthesis.getVoices().find(v =>
    /^kk(?:[-_]|$)/i.test(v.lang)
  );

  if (!voice) {
    voiceFailure(id);
    return;
  }

  speech = new SpeechSynthesisUtterance(QUESTIONS[state.index].text);
  speech.voice = voice;
  speech.lang = "kk-KZ";
  speech.rate = .92;
  speech.onend = () => {
    if (id === voiceId) beginThinking();
  };
  speech.onerror = () => voiceFailure(id);
  speechSynthesis.speak(speech);
}

$("read").onclick = () => {
  if (reading || clock || paused || closed() ||
      selected !== null || state.done) return;

  stopVoice();
  stopMusic();
  const id = voiceId;
  reading = true;

  $("orb").classList.add("speaking");
  $("voiceStatus").textContent = "Сұрақ оқылуда…";
  ui();

  watchdog = setTimeout(() => voiceFailure(id),60000);

  // q1.mp3 ... q9.mp3 файлдары жүктелсе, солар оқылады.
  
audio = new Audio(`q${state.index+1}.mp3.mp3?v=2`);
audio.muted = false;
audio.volume = 1;
audio.playbackRate = 1;
    if (id === voiceId) beginThinking();
  };
  audio.onerror = () => deviceVoice(id);
  audio.play().catch(() => deviceVoice(id));
};

$("start").onclick = beginThinking;

document.querySelectorAll(".choose").forEach(button => {
  button.onclick = () => {
    const team = Number(button.dataset.team);
    if (state.done || reading || selected !== null ||
        closed() || !record().open ||
        record().wrong.includes(team)) return;

    if (clock && timerKind === "thinking") {
      thinkingLeft = Math.max(
        0,(deadline-performance.now())/1000
      );
    }

    stopClock();
    stopVoice();
    selected = team;
    $("banner").textContent =
      `${NAMES[team]} жауап береді! Жауапқа 5 секунд.`;

    note([660,784,1047][team],.3,0,.04);
    runTimer(5,"answer");
  };
});

$("correct").onclick = () => {
  if (selected === null || closed()) return;

  const team = selected;
  stopClock();
  stopVoice();

  record().winner = team;
  record().revealed = true;
  selected = null;
  paused = false;

  save();
  $("banner").textContent =
    `${NAMES[team]} — дұрыс жауап! +10 ұпай. Келесі сұраққа өте беріңіз.`;

  [523,659,784].forEach((f,i) => note(f,.6,i*.14,.04));
  ui();
};

$("wrong").onclick = () => {
  if (selected === null || closed()) return;

  const team = selected;
  stopClock();
  record().wrong.push(team);
  selected = null;
  paused = false;

  if (record().wrong.length === 3) {
    record().revealed = true;
    $("banner").textContent =
      "Үш топ та жауап берді. Дұрыс жауап ашылды.";
    ui();
  } else {
    $("banner").textContent =
      `${NAMES[team]}: жауап қабылданбады. Қалған топтарға мүмкіндік!`;

    if (thinkingLeft > 0) {
      runTimer(thinkingLeft,"thinking");
    } else {
      left = 0;
      timerKind = "thinking";
      timerPaint();
      ui();
    }
  }
  save();
};

$("pause").onclick = () => {
  if (clock) {
    tick();
    if (!clock) return;

    stopClock();
    paused = true;
    $("banner").textContent = "Таймер кідіртілді.";
    ui();
  } else if (paused && left > 0) {
    runTimer(left,timerKind);
    $("banner").textContent = selected !== null
      ? `${NAMES[selected]} жауап береді.`
      : "Жарыс жалғасуда. Белгі берген топты таңдаңыз.";
  }
};

$("reveal").onclick = () => {
  if (state.done || closed()) return;

  if (!confirm("Жауапты ашамыз ба? Бұл сұраққа бұдан кейін ұпай берілмейді.")) return;

  stopClock();
  stopVoice();
  selected = null;
  paused = false;
  record().revealed = true;
  save();

  $("banner").textContent =
    "Дұрыс жауап ашылды. Бұл сұраққа ұпай берілмеді.";
  ui();
};

$("next").onclick = () => {
  if (state.done) return;

  if (record().winner === null && !confirm(
    "Бұл сұраққа ұпай берілмеді. Келесіге өтеміз бе?"
  )) return;

  stopClock();
  stopVoice();

  if (state.index === QUESTIONS.length-1) {
    if (!confirm("Бірінші турды аяқтаймыз ба?")) return;
    state.done = true;
  } else state.index++;

  save();
  show();
};

$("undo").onclick = () => {
  if (!confirm(
    "Осы сұрақтың ұпайы мен жауап беру тарихын тазалаймыз ба?"
  )) return;

  state.records[state.index] = {
    winner:null,wrong:[],revealed:false,open:true
  };
  save();
  show();
};

$("music").onclick = () => {
  musicEnabled = !musicEnabled;
  $("music").textContent =
    "♫ Әуен: "+(musicEnabled ? "қосулы" : "өшірулі");

  if (!musicEnabled) stopMusic();
  else {
    unlock();
    if (clock && timerKind === "thinking") startMusic();
  }
};

$("reset").onclick = () => {
  if (!confirm("1-турдың барлық ұпайын өшіріп, қайта бастаймыз ба?")) return;
  state = fresh();
  save();
  show();
};

document.addEventListener("visibilitychange",() => {
  if (document.hidden) {
    // Басқа бетке ауысқанда уақыт пен дыбысты кідірту.
    if (clock) {
      tick();
      if (clock) {
        stopClock();
        paused = true;
        ui();
      }
    } else stopMusic();

    if (reading) {
      stopVoice();
      $("voiceStatus").textContent =
        "Оқу тоқтатылды. Қайта тыңдаңыз немесе таймерді бастаңыз.";
      ui();
    }
  }
});

window.addEventListener("pagehide",() => {
  stopClock();
  stopVoice();
});

show();
</script>
</body>
</html>
